name: Build and publish Docker image

# Keeps the images in step with upstream's newest tag: a daily cron resolves
# Niko1221/Strata's newest tag and pushes ghcr.io/<owner>/<repo> for BOTH
# architectures - CMP 170HX / A100 (sm80, CUDA 13) and Tesla P40 / P100 (sm61,
# Pascal, the experimental CUDA 12 engine) - each tagged <arch>-<upstream-tag>
# (e.g. sm80-v0.1.45, sm61-v0.1.45) and <arch>-latest.  Both are built on every
# run; the CUDA 12 base is what the sm61 image needs (CUDA 13 dropped Pascal).
on:
  schedule:
    - cron: "20 6 * * *"   # daily 06:20 UTC
  workflow_dispatch:
    inputs:
      strata_ref:
        description: "Upstream ref/tag to build (default: the newest tag)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: Niko1221/Strata
  # setup.py refuses an engine older than this (MIN_ENGINE) and "K-quant experts /
  # MMQ prompt library" landed in v0.1.44, so nothing below it is worth publishing.
  MIN_TAG: v0.1.45

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: 80
            suffix: sm80                                  # CMP 170HX (GA100), A100 - CUDA 13
            cuda_base: 13.0.0-devel-ubuntu24.04
          - cuda_arch: 61
            suffix: sm61                                  # Tesla P40 / P100, GTX 10 (Pascal) - CUDA 12
            cuda_base: 12.9.1-devel-ubuntu24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Resolve upstream's newest tag
        id: latest
        run: |
          if [ -n "${{ inputs.strata_ref || '' }}" ]; then
            TAG="${{ inputs.strata_ref }}"
          else
            TAG=$(git ls-remote --tags "https://github.com/$UPSTREAM.git" \
              | awk -F/ '{print $3}'; true)
            TAG=$(echo "$TAG" | grep -v '\^{}$' | grep '^v' | sort -V | uniq | tail -1)
          fi
          [ -n "$TAG" ] || { echo "no tag found" >&2; exit 1; }
          NEWEST=$(printf '%s\n%s\n' "$MIN_TAG" "$TAG" | sort -V | tail -1)
          if [ "$NEWEST" != "$TAG" ]; then
            echo "upstream's newest tag $TAG is older than the required $MIN_TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG (arch ${{ matrix.suffix }})"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            STRATA_REF=${{ steps.latest.outputs.tag }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            CUDA_BASE=${{ matrix.cuda_base }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.suffix }}-${{ steps.latest.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ matrix.suffix }}-latest
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Record the digest
        run: |
          echo "## ${{ matrix.suffix }} - ${{ steps.latest.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}:${{ matrix.suffix }}-${{ steps.latest.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
